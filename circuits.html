<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circuits - GN2R BOTS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Lato', sans-serif;
            background-color: #FDF6E3;
        }
        h1, h2, h3, h4, .font-pirate {
            font-family: 'IM Fell English SC', serif;
        }
        .nav-link {
            transition: all 0.3s;
            border-bottom: 2px solid transparent;
        }
        .nav-link:hover, .nav-link.active {
            color: #D35400;
            border-bottom-color: #D35400;
        }
    </style>
</head>
<body class="text-gray-800">
    <header id="header" class="bg-[#FDF6E3] bg-opacity-90 backdrop-blur-sm sticky top-0 z-50 shadow-md">
        <nav class="container mx-auto px-6 py-3 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-pirate text-[#2C3E50]">GN2R BOTS</a>
            <div class="hidden md:flex space-x-8">
                <a href="index.html#map" class="nav-link text-lg">The Map</a>
                <a href="index.html#what-is-robotics" class="nav-link text-lg">What is Robotics?</a>
                <a href="index.html#legends" class="nav-link text-lg">Legends</a>
                <a href="index.html#quest" class="nav-link text-lg">Our Quest</a>
                <a href="index.html#treasure" class="nav-link text-lg">The Treasure</a>
                <a href="robot-components.html" class="nav-link text-lg">Robot Components</a>
                <a href="lets-make-wheels.html" class="nav-link text-lg">Let's Make Wheels</a>
                <a href="circuits.html" class="nav-link text-lg">Circuits</a>
            </div>
            <button id="mobile-menu-button" class="text-2xl" aria-label="Open menu">☰</button>
        </nav>
        <div id="mobile-menu" class="fixed top-0 right-0 w-64 h-full bg-[#FDF6E3] shadow-lg z-50 hidden flex-col px-6 pb-4 pt-8 transition-transform duration-300">
            <button id="close-mobile-menu" class="text-2xl absolute top-4 right-6 text-[#2C3E50]" aria-label="Close menu">&times;</button>
            <a href="index.html#map" class="block py-2 text-lg text-[#2C3E50]">The Map</a>
            <a href="index.html#what-is-robotics" class="block py-2 text-lg text-[#2C3E50]">What is Robotics?</a>
            <a href="index.html#legends" class="block py-2 text-lg text-[#2C3E50]">Legends</a>
            <a href="index.html#quest" class="block py-2 text-lg text-[#2C3E50]">Our Quest</a>
            <a href="index.html#treasure" class="block py-2 text-lg text-[#2C3E50]">The Treasure</a>
            <a href="robot-components.html" class="block py-2 text-lg text-[#2C3E50]">Robot Components</a>
            <a href="lets-make-wheels.html" class="block py-2 text-lg text-[#2C3E50]">Let's Make Wheels</a>
            <a href="circuits.html" class="block py-2 text-lg text-[#2C3E50]">Circuits</a>
        </div>
    </header>
    <main class="container mx-auto px-4 py-8">
        <section class="text-center">
            <h2 class="text-2xl font-pirate mb-4">Circuit LED Animation</h2>
            <img src="assets/circuit_led.gif" alt="Circuit LED Animation" class="mx-auto border-4 border-[#D35400] rounded-lg shadow-lg">
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Hamburger menu logic
            const mobileMenuButton = document.getElementById('mobile-menu-button');
            const mobileMenu = document.getElementById('mobile-menu');
            const closeMobileMenu = document.getElementById('close-mobile-menu');
            mobileMenuButton.addEventListener('click', () => {
                mobileMenu.classList.remove('hidden');
            });
            closeMobileMenu.addEventListener('click', () => {
                mobileMenu.classList.add('hidden');
            });
        });
    </script>
</body>
</html>
